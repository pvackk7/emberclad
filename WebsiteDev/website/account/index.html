<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Account · Emberclad</title>
<meta name="theme-color" content="#07070a">
<meta name="robots" content="noindex">
<link rel="icon" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{--bg:#07070a;--ink:#b7ad9b;--dim:#6b6457;--gold:#c9b87a;--line:rgba(201,184,122,.14);--bad:#b5654a}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"EB Garamond",Georgia,serif;min-height:100%}
  body{min-height:100vh;display:flex;flex-direction:column;
       background:radial-gradient(ellipse at 50% 0%,rgba(201,184,122,.06),transparent 55%),var(--bg)}
  .topbar{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;justify-content:space-between;
          padding:0 clamp(14px,3vw,32px);background:rgba(5,5,7,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .home{display:block;height:20px}
  .home img{height:100%;width:auto;display:block;opacity:.85;transition:opacity .3s}
  .home:hover img{opacity:1}
  .profile{width:36px;height:36px;display:grid;place-items:center;color:var(--gold);border:1px solid var(--line);border-radius:50%}
  .profile svg{width:22px;height:22px}

  main{flex:1;width:100%;max-width:820px;margin:0 auto;padding:clamp(48px,9vw,96px) clamp(16px,5vw,40px);box-sizing:border-box}
  .eyebrow{font-family:Cinzel,serif;font-size:.7rem;letter-spacing:.4em;color:var(--gold);opacity:.75;margin:0 0 1rem;text-align:center}
  h1{font-family:Cinzel,serif;font-weight:400;color:#d8cdb4;font-size:clamp(1.5rem,4vw,2.3rem);letter-spacing:.06em;margin:0 0 2.2rem;text-align:center}
  [hidden]{display:none!important}

  .card{max-width:400px;margin:0 auto;border:1px solid var(--line);background:rgba(255,255,255,.012);padding:30px clamp(18px,5vw,34px)}
  .tabs{display:flex;margin:-30px calc(-1*clamp(18px,5vw,34px)) 26px;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;background:none;border:0;padding:15px 0;font-family:Cinzel,serif;font-size:.72rem;letter-spacing:.3em;color:var(--dim);cursor:pointer;border-bottom:1px solid transparent;margin-bottom:-1px}
  .tabs button[aria-selected=true]{color:var(--gold);border-bottom-color:var(--gold)}
  label{display:block;font-family:Cinzel,serif;font-size:.66rem;letter-spacing:.3em;color:var(--dim);margin:0 0 8px}
  input{width:100%;box-sizing:border-box;background:#0b0b0f;border:1px solid var(--line);color:#e2d8c2;font:inherit;font-size:1.08rem;padding:11px 12px;margin:0 0 18px;border-radius:0;outline:none;transition:border-color .3s}
  input:focus{border-color:rgba(201,184,122,.55)}
  .go{width:100%;padding:13px;margin-top:6px;background:transparent;border:1px solid rgba(201,184,122,.55);color:#e2d8c2;font-family:Cinzel,serif;letter-spacing:.3em;font-size:.78rem;cursor:pointer;transition:background .3s,border-color .3s}
  .go:hover{background:rgba(201,184,122,.08);border-color:var(--gold)}
  .go:disabled{opacity:.5;cursor:default}
  .msg{min-height:1.4em;margin:14px 0 0;font-style:italic;color:var(--bad);text-align:center}
  .fine{font-style:italic;color:var(--dim);text-align:center;font-size:.95rem;margin:18px 0 0}

  .who{text-align:center;color:var(--dim);margin:-1.2rem 0 2.4rem}
  .who b{color:var(--ink);font-weight:400}
  .who button{background:none;border:0;color:var(--gold);font:inherit;font-style:italic;cursor:pointer;padding:0 0 0 .6em;text-decoration:underline;text-underline-offset:4px}
  .table{border:1px solid var(--line);background:rgba(255,255,255,.012)}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{font-family:Cinzel,serif;font-weight:400;font-size:.66rem;letter-spacing:.28em;color:var(--dim);text-align:left;padding:14px 16px;border-bottom:1px solid var(--line)}
  td{padding:13px 16px;border-bottom:1px solid rgba(201,184,122,.06);font-size:1.06rem}
  tbody tr:last-child td{border-bottom:0}
  .n{color:#d8cdb4;overflow-wrap:anywhere} .t{color:var(--gold);text-align:right} .d,.r,.w{text-align:right;color:var(--dim)}
  th.t,th.d,th.r,th.w{text-align:right}
  tr.empty td{text-align:center;font-style:italic;color:var(--dim);padding:28px 16px}
  @media (max-width:560px){ th.w,td.w{display:none} th,td{padding:11px 9px} th{letter-spacing:.16em} }

  footer{padding:30px 16px 40px;text-align:center;border-top:1px solid var(--line);color:var(--dim);font-size:.85rem}
  footer a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>
<nav class="topbar" aria-label="Site">
  <a class="home" href="/" aria-label="Emberclad home"><img src="/img/title.png" alt="Emberclad"></a>
  <span class="profile" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8.5" r="4"/><path d="M4 20.5c1.4-3.8 4.4-5.6 8-5.6s6.6 1.8 8 5.6"/></svg>
  </span>
</nav>

<main>
  <!-- Logged out -->
  <section id="auth" hidden>
    <p class="eyebrow">ACCOUNT</p>
    <h1 id="auth-title">Keep your runs</h1>
    <div class="card">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-login" aria-selected="true">LOG IN</button>
        <button type="button" role="tab" id="tab-signup" aria-selected="false">SIGN UP</button>
      </div>
      <form id="form" novalidate>
        <label for="email">EMAIL</label>
        <input id="email" type="email" autocomplete="email" required maxlength="254">
        <label for="password">PASSWORD</label>
        <input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="200">
        <button class="go" id="go" type="submit">LOG IN</button>
        <p class="msg" id="msg" role="alert"></p>
      </form>
    </div>
    <p class="fine">Log in before you press Play, and every run you finish is saved here under whichever nickname you choose.</p>
  </section>

  <!-- Logged in -->
  <section id="runs" hidden>
    <p class="eyebrow">YOUR RUNS</p>
    <h1>Every flame you have carried</h1>
    <p class="who">Signed in as <b id="who"></b><button type="button" id="logout">Log out</button></p>
    <div class="table">
      <table>
        <thead><tr><th>Nickname</th><th class="t">Run time</th><th class="d">Deaths</th><th class="r">Rank</th><th class="w">Date</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<footer><a href="/">&larr; Back to Emberclad</a></footer>

<script>
(function () {
  var auth = document.getElementById('auth'), runs = document.getElementById('runs'), form = document.getElementById('form'),
      email = document.getElementById('email'), pass = document.getElementById('password'), go = document.getElementById('go'),
      msg = document.getElementById('msg'), tabIn = document.getElementById('tab-login'), tabUp = document.getElementById('tab-signup'),
      rows = document.getElementById('rows'), mode = 'login';

  function api(path, body) {
    return fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), credentials: 'same-origin' }
                            : { credentials: 'same-origin', cache: 'no-store' })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { d._status = r.status; return d; }); });
  }
  function fmt(ms) {
    var cs = Math.floor(ms / 10) % 100, t = Math.floor(ms / 1000), s = t % 60, m = Math.floor(t / 60) % 60, h = Math.floor(t / 3600);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return (h ? h + ':' + p(m) : m) + ':' + p(s) + '.' + p(cs);
  }
  function setMode(m) {
    mode = m;
    tabIn.setAttribute('aria-selected', m === 'login'); tabUp.setAttribute('aria-selected', m === 'signup');
    go.textContent = m === 'login' ? 'LOG IN' : 'CREATE ACCOUNT';
    pass.autocomplete = m === 'login' ? 'current-password' : 'new-password';
    pass.placeholder = m === 'signup' ? 'At least 8 characters' : '';
    msg.textContent = '';
  }
  function cell(tr, cls, text) { var td = document.createElement('td'); td.className = cls; td.textContent = text; tr.appendChild(td); }
  function showRuns(data) {
    auth.hidden = true; runs.hidden = false;
    document.getElementById('who').textContent = data.user.email;
    rows.innerHTML = '';
    if (!data.runs.length) {
      var tr = document.createElement('tr'), td = document.createElement('td'); tr.className = 'empty'; td.colSpan = 5;
      td.textContent = 'No finished runs yet. Fell the Bone Warden and they will appear here.'; tr.appendChild(td); rows.appendChild(tr); return;
    }
    data.runs.forEach(function (r) {
      var tr = document.createElement('tr');
      cell(tr, 'n', r.nickname); cell(tr, 't', fmt(r.runMs)); cell(tr, 'd', r.deaths); cell(tr, 'r', '#' + r.rank);
      cell(tr, 'w', new Date(r.finishedAt).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }));
      rows.appendChild(tr);
    });
  }
  function load() {
    api('/api/me/runs').then(function (d) {
      if (d._status === 200) showRuns(d); else { runs.hidden = true; auth.hidden = false; email.focus(); }
    }).catch(function () { auth.hidden = false; msg.textContent = 'Accounts work on emberclad.org, not in a preview file.'; });
  }
  tabIn.addEventListener('click', function () { setMode('login'); });
  tabUp.addEventListener('click', function () { setMode('signup'); });
  form.addEventListener('submit', function (e) {
    e.preventDefault(); msg.textContent = ''; go.disabled = true;
    api(mode === 'login' ? '/api/auth/login' : '/api/auth/signup', { email: email.value, password: pass.value })
      .then(function (d) { if (d._status === 200) { pass.value = ''; load(); } else msg.textContent = d.error || 'Something went wrong. Try again.'; })
      .catch(function () { msg.textContent = 'Could not reach the server. Try again.'; })
      .then(function () { go.disabled = false; });
  });
  document.getElementById('logout').addEventListener('click', function () {
    api('/api/auth/logout', {}).then(function () { setMode('login'); load(); });
  });
  setMode(location.hash === '#signup' ? 'signup' : 'login');
  load();
})();
</script>
</body>
</html>
