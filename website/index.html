<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emberclad</title>
<meta name="description" content="Emberclad: a dark fantasy adventure.">
<meta property="og:title" content="Emberclad">
<meta property="og:image" content="img/video-poster.jpg">
<meta name="theme-color" content="#07070a">
<link rel="icon" href="img/favicon.png">
<link rel="preload" href="img/title.png" as="image">
<style>
  html,body{margin:0;height:100%;background:#07070a;overflow:hidden}
  .stage{position:fixed;inset:0;background:#07070a url(img/video-poster.jpg) center/cover no-repeat}
  .stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;filter:saturate(.85)}
  /* hide any built-in play/start button browsers may draw */
  .stage video::-webkit-media-controls,
  .stage video::-webkit-media-controls-start-playback-button,
  .stage video::-webkit-media-controls-overlay-play-button{display:none!important;-webkit-appearance:none}
  .shade{position:absolute;inset:0;pointer-events:none;background:
      radial-gradient(ellipse at 50% 45%,rgba(7,7,10,0) 35%,rgba(7,7,10,.7) 100%),
      linear-gradient(to bottom,rgba(7,7,10,.25) 0%,rgba(7,7,10,0) 35%,rgba(7,7,10,.55) 75%,rgba(7,7,10,.92) 100%)}
  h1{position:absolute;left:50%;bottom:clamp(28px,8vh,96px);transform:translateX(-50%);margin:0;width:min(78vw,1100px);
     filter:drop-shadow(0 6px 24px rgba(0,0,0,.85))}
  h1 img{display:block;width:100%;height:auto}
  @media (max-aspect-ratio:1/1){ h1{width:88vw;bottom:auto;top:50%;transform:translate(-50%,-50%)} }
</style>
</head>
<body>
<main class="stage">
  <video id="bg" autoplay muted loop playsinline webkit-playsinline disablepictureinpicture disableremoteplayback preload="auto" poster="img/video-poster.jpg" aria-hidden="true" tabindex="-1">
    <source src="video/emberclad-demo.mp4" type="video/mp4">
  </video>
  <div class="shade" aria-hidden="true"></div>
  <h1><img src="img/title.png" alt="Emberclad" width="1400" height="257"></h1>
</main>
<script>
  // Start the video without a play button, and retry on first touch if the browser held it back.
  (function () {
    var v = document.getElementById('bg');
    v.muted = true; v.defaultMuted = true;
    function go() { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
    go();
    ['touchstart', 'pointerdown', 'scroll', 'keydown'].forEach(function (e) {
      window.addEventListener(e, go, { once: true, passive: true });
    });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) go(); });
  })();
</script>
</body>
</html>
